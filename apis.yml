aid: gilion-formerly-ark
name: Gilion (formerly ArK)
description: 'Gilion (formerly ArK) is an AI-powered financial platform, headquartered
  in Stockholm, that sits between founders and investors to streamline how growth
  capital is allocated. For companies it offers non-dilutive growth funding for SaaS
  and technology businesses, including a Growth Loan and Seasonal Credit, underwritten
  by AI models of a company''s trajectory. For banks, funds, and investors it offers
  an agentic-AI investment platform covering sourcing, due diligence, monitoring, and
  portfolio reporting. Gilion was rebranded from ArK and is backed by Creandum. The
  company publishes a public Trust Center (SOC 2 Type 2, CSA STAR, GDPR/CCPA/CPRA)
  but does not currently expose a public developer API; this profile tracks its
  security, compliance, and web presence in the API Evangelist network.'
